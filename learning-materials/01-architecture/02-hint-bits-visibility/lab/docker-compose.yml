services:
  pg-hint-bits:
    image: postgres:17
    container_name: pg-hint-bits
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: labdb
    ports:
      - "5464:5432"
    volumes:
      - ./setup.sql:/docker-entrypoint-initdb.d/01-setup.sql
      - pg-hint-bits-data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=128MB
      -c wal_log_hints=on
      -c autovacuum_naptime=30s
      -c autovacuum_vacuum_threshold=100
      -c autovacuum_vacuum_scale_factor=0.1
      -c log_autovacuum_min_duration=0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 1s
      retries: 5

volumes:
  pg-hint-bits-data:
