services:
  pg-multixact:
    image: postgres:17
    container_name: pg-multixact
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: labdb
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - max_connections=200
      - -c
      - max_locks_per_transaction=128
      - -c
      - log_autovacuum_min_duration=0
      - -c
      - autovacuum_freeze_max_age=200000000
      - -c
      - autovacuum_multixact_freeze_max_age=200000000
    ports:
      - "5465:5432"
    volumes:
      - ./setup.sql:/docker-entrypoint-initdb.d/01-setup.sql
      - pg-multixact-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d labdb"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 10s

volumes:
  pg-multixact-data:
