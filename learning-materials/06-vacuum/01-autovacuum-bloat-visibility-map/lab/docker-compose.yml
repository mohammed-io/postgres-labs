services:
  postgres-vacuum:
    image: postgres:17
    container_name: postgres-vacuum
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: labdb
    ports:
      - "5439:5432"
    volumes:
      - ./setup.sql:/docker-entrypoint-initdb.d/01-setup.sql
      - postgres-data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=256MB
      -c autovacuum_naptime=10s
      -c autovacuum_vacuum_threshold=100
      -c autovacuum_vacuum_scale_factor=0.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s

volumes:
  postgres-data:
