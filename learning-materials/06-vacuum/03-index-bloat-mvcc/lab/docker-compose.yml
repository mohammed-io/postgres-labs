services:
  pg-index-bloat:
    image: postgres:17
    container_name: pg-index-bloat
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: labdb
    ports:
      - "5463:5432"
    volumes:
      - ./setup.sql:/docker-entrypoint-initdb.d/01-setup.sql
      - pg-index-bloat-data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=256MB
      -c autovacuum=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 10

volumes:
  pg-index-bloat-data:
