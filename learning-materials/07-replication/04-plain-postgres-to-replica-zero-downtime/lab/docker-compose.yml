services:
  postgres-primary:
    image: postgres:17
    container_name: pg-plain-primary
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    ports:
      - "5451:5432"
    volumes:
      - primary-data:/var/lib/postgresql/data
      - ./setup.sql:/docker-entrypoint-initdb.d/01-setup.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 1s
      timeout: 2s
      retries: 30

  postgres-replica-1:
    image: postgres:17
    container_name: pg-plain-replica-1
    user: postgres
    profiles: ["replicas"]
    depends_on:
      postgres-primary:
        condition: service_healthy
    ports:
      - "5452:5432"
    volumes:
      - replica1-data:/var/lib/postgresql/data
    command: >
      bash -ec "
      until pg_isready -h postgres-primary -U postgres -d appdb; do sleep 1; done;
      rm -rf /var/lib/postgresql/data/*;
      export PGPASSWORD=replicator_pass;
      pg_basebackup -h postgres-primary -D /var/lib/postgresql/data -U replicator -P -w -R -X stream --slot replica_1_slot;
      chmod 700 /var/lib/postgresql/data;
      exec postgres"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 2s
      timeout: 2s
      retries: 40

  postgres-replica-2:
    image: postgres:17
    container_name: pg-plain-replica-2
    user: postgres
    profiles: ["replicas"]
    depends_on:
      postgres-primary:
        condition: service_healthy
    ports:
      - "5453:5432"
    volumes:
      - replica2-data:/var/lib/postgresql/data
    command: >
      bash -ec "
      until pg_isready -h postgres-primary -U postgres -d appdb; do sleep 1; done;
      rm -rf /var/lib/postgresql/data/*;
      export PGPASSWORD=replicator_pass;
      pg_basebackup -h postgres-primary -D /var/lib/postgresql/data -U replicator -P -w -R -X stream --slot replica_2_slot;
      chmod 700 /var/lib/postgresql/data;
      exec postgres"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 2s
      timeout: 2s
      retries: 40

volumes:
  primary-data:
  replica1-data:
  replica2-data:
